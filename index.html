<!DOCTYPE html><html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muttertags Geschenk</title>  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background: #000;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    canvas {
      display: block;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      color: #fff;
      z-index: 20;
      text-align: center;
      font-size: 16px;
    }

    #text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      z-index: 10;
      opacity: 0;
      transition: opacity 2s ease;
      max-width: 85vw;
      line-height: 1.5;
      pointer-events: none;
    }

    #text .line1 {
      font-size: 22px;
      font-weight: 600;
    }

    #text .line2 {
      font-size: 16px;
      opacity: 0.9;
      margin-top: 10px;
    }
  </style></head><body><div id="overlay">
  Zum Starten klicken
</div><div id="text">
  <div class="line1">Alles Gute zum Muttertag nachträglich</div>
  <div class="line2">Auch wenn ich es vergessen habe, hab ich dich trotzdem lieb</div>
</div><audio id="audio" src="song.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script><script>
let scene, camera, renderer;
let geometry, pointCloud;

let points = [];
let targets = [];
let started = false;

// 🔥 nochmal deutlich größer (2 Stufen +)
const SIZE_FACTOR = 1.6;

init();
animate();

function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return new THREE.Vector3(x, y, (Math.random() - 0.5) * 10);
}

function getScale() {
  const visibleHeight = window.innerHeight;
  return (visibleHeight * 0.0032) * SIZE_FACTOR;
}

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 220;

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  window.addEventListener("resize", onResize);

  document.body.addEventListener("click", startAnimation);
}

function buildHeart() {
  const count = 900;
  const scale = getScale();

  points = [];
  targets = [];

  for (let i = 0; i < count; i++) {
    const t = Math.random() * Math.PI * 2;

    const target = heartPoint(t);

    targets.push(new THREE.Vector3(
      target.x * scale,
      target.y * scale,
      target.z * scale
    ));

    points.push(new THREE.Vector3(0, 0, 0));
  }

  geometry = new THREE.BufferGeometry().setFromPoints(points);

  const material = new THREE.PointsMaterial({
    color: 0xff4d88,
    size: 1.6
  });

  pointCloud = new THREE.Points(geometry, material);
  scene.add(pointCloud);
}

function startAnimation() {
  if (started) return;
  started = true;

  document.getElementById("overlay").style.display = "none";

  buildHeart();
  document.getElementById("audio").play();

  points.forEach((p, i) => {
    gsap.to(p, {
      x: targets[i].x,
      y: targets[i].y,
      z: targets[i].z,
      duration: Math.random() * 3 + 2,
      ease: "power3.out",
      onUpdate: function() {
        geometry.setFromPoints(points);
      }
    });
  });

  gsap.to(pointCloud.rotation, {
    y: Math.PI * 2,
    duration: 10,
    repeat: -1,
    ease: "none"
  });

  setTimeout(() => {
    document.getElementById("text").style.opacity = 1;
  }, 4200);
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
</script></body>
</html>
